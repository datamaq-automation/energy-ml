<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identificador de Cargas</title>

<script src="/static/energia.js" defer></script>
</head>
<body>
<main>
<h1>Identificador de Cargas (NILM)</h1>
<form id="f">

  <label>Desde<input type="date" name="desde" value="2026-09-12" required></label>
  <label>Hasta<input type="date" name="hasta" value="2026-10-03" required></label>
  <button>Identificar</button>
</form>
<p id="resumen" class="muted">Elegí un medidor y un rango.</p>
<div id="cargas"></div>
</main>
</body>
